<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKC — Streamline Kitchen Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/styles.css?v=3">
</head>
<body class="skc-exec skc-role-gm">

  <!-- Overlays, drawers, modals, ask panel — fetched by loader -->
  <div id="layout-drawers"></div>
  <div id="layout-ask-panel"></div>

  <!-- Sidebar — fetched by loader into the original #sidebar wrapper -->
  <div id="sidebar"></div>

  <!-- Main shell -->
  <div id="shell">
    <div id="topbar"></div>

    <!-- Doctrine bar (always present; hidden by default; toggled by demo controls) -->
    <div class="da-doctrine-bar" id="daBar" style="display:none">
      <span class="da-doctrine-text"><strong>SKC turns Toast data into verified profit recovery.</strong> · Only <strong>Verified Savings</strong> count toward ROI · Active Recovery and Open Exposure are not counted until post-action monitoring confirms.</span>
      <button class="btn btn-ghost" style="font-size:10px;padding:1px 8px;flex-shrink:0" onclick="openDrawer('value-defs')">How values are classified →</button>
    </div>

    <div id="content">
      <div class="content-inner" id="screen-container">
        <!-- Screens fetched/appended here by loader.js -->
      </div>
    </div>
  </div>

  <!-- Loader is the sole entry point. It fetches components + screens,
       then dynamically injects data/core/controllers/server-coaching/tooltips
       in order so they run against a fully populated DOM. See shared/loader.js
       for the init-timing rationale. -->
  <script src="shared/loader.js?v=3"></script>
</body>
</html>
